# Simplified from PhysGraph's ResDexHandPPO.yaml -- that config targets a
# dict-based multi-modal observation with a pretrained-checkpoint residual
# architecture (bimanual transformer network), neither of which applies
# here: our observation is a simple flat vector, and per Runfa's own
# direction the immediate goal is just proving basic training works on a
# fixed trajectory, not replicating the full sophisticated architecture.
# Uses rl_games' own standard PPO + MLP network instead. PPO hyperparameters
# below (gamma, tau, learning_rate, horizon_length, etc.) are carried over
# directly from PhysGraph's own config where they're genuinely reusable.
params:
  seed: ${...seed}
  algo:
    name: ppo

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path:

  config:
    name: ${resolve_default:MyoHandPour,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_input_excluded_keys: []
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: ${resolve_default:5e-4,${....learning_rate}}
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: ${resolve_default:10000,${....max_iterations}}
    save_best_after: 2
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 128
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    bounds_loss_coef: 0.0001
