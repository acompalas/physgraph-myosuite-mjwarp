# Adapted from PhysGraph's ResDexHandPPO.yaml. Real dict-based multi-modal
# observation (proprioception/privileged/target streams, bimanual-SHAPED
# with an inert LH placeholder -- see envs/mjwarp_myohand_env.py), using
# lib.nn.features.SimpleFeatureFusion/Identity for feature extraction
# (real, unmodified PhysGraph utility classes) instead of the full
# graph-transformer network (network_builder_transformer_bih_graph_
# improve_correct.py), which is hardcoded to a different embodiment's
# exact dof/body counts plus real BPS object-shape encoding we don't
# compute yet -- adopting that network faithfully is a deliberate,
# separate future milestone. Dropped: the pretrained-checkpoint residual
# architecture (no base policy to load from, training from scratch).
# PPO hyperparameters below (gamma, tau, learning_rate, horizon_length,
# etc.) are carried over directly from PhysGraph's own config where
# they're genuinely reusable.
params:
  seed: ${...seed}
  algo:
    name: ppo

  model:
    name: continuous_a2c_logstd

  # dict-observation network -- real SimpleFeatureFusion/Identity feature
  # extraction (lib/nn/features/) feeding a standard actor-critic head,
  # matching PhysGraph's own ResBiHDictObsBuilder pattern but with our
  # MyoHand dimensions instead of their hardcoded ArtiMANO ones. See
  # lib/rl/network_builder_myohand_simple.py for the full rationale.
  network:
    name: myohand_simple_dict_obs_actor_critic

  load_checkpoint: False
  load_path:

  config:
    name: ${resolve_default:MyoHandPour,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_input_excluded_keys: []
    normalize_value: True
    use_pid_control: ${....usePIDControl}
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: ${resolve_default:5e-4,${....learning_rate}}
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: ${resolve_default:10000,${....max_iterations}}
    save_best_after: 2
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 128
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    bounds_loss_coef: 0.0001
