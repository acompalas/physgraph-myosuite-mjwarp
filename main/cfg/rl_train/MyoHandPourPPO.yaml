# Adapted from PhysGraph's ResDexHandPPO.yaml. Network is the full graph
# transformer ported to MyoHand (lib/rl/network_builder_myohand_transformer.py,
# built on PhysGraph's real network_builder_transformer_bih_graph_improve_correct.py),
# with right-hand-only observations (inert LH placeholder). Dropped: the
# pretrained-checkpoint residual architecture (training from scratch).
# PPO hyperparameters match PhysGraph's DexHandImitatorPPO.yaml (minibatch 1024).

params:
  seed: ${...seed}
  algo:
    name: ppo

  model:
    name: continuous_a2c_logstd

  # dict-observation network -- real SimpleFeatureFusion/Identity feature
  # extraction (lib/nn/features/) feeding a standard actor-critic head,
  # matching PhysGraph's own ResBiHDictObsBuilder pattern but with our
  # MyoHand dimensions instead of their hardcoded ArtiMANO ones. See
  # lib/rl/network_builder_myohand_simple.py for the full rationale.
  network:
    name: myohand_transformer_actor_critic

  load_checkpoint: False
  load_path:

  config:
    name: ${resolve_default:MyoHandPour,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_input_excluded_keys: []
    normalize_value: True
    use_pid_control: ${....usePIDControl}
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: ${resolve_default:5e-4,${....learning_rate}}
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: ${resolve_default:10000,${....max_iterations}}
    early_stop_epochs: ${resolve_default:500,${....early_stop_epochs}}
    save_best_after: 2
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 1024
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    bounds_loss_coef: 0.0001
